name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  print-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # print.test.ts needs neither Supabase nor real env values, but
      # vitest's global setupFiles (test/setup/load-env.ts) unconditionally
      # loads .dev.vars/.env.test for every run — empty files satisfy that
      # precondition without pulling in the Supabase-in-CI setup Phase 3 adds.
      - run: touch .dev.vars .env.test
      - run: npx vitest run "src/pages/patterns/[id]/print.test.ts"
